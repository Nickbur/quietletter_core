services:
    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: quietletter
            POSTGRES_PASSWORD: quietletter
            POSTGRES_DB: quietletter
        volumes:
            - quietletter_pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U quietletter -d quietletter']
            interval: 5s
            timeout: 5s
            retries: 10

    server:
        build: .
        restart: unless-stopped
        init: true
        env_file:
            - .env
        environment:
            # Force the in-container bind + DB host regardless of what .env carries, so
            # the published port mapping below always matches.
            PORT: '8080'
            DATABASE_URL: 'postgres://quietletter:quietletter@db:5432/quietletter'
        depends_on:
            db:
                condition: service_healthy
        ports:
            - '${PORT:-8080}:8080'

volumes:
    quietletter_pgdata:
